name: Build DualRecorder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: >
          dotnet publish "DualRecorder/src/DualRecorder/DualRecorder.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o "artifacts/publish"

      - name: Upload DualRecorder executable
        uses: actions/upload-artifact@v4
        with:
          name: DualRecorder-exe
          path: artifacts/publish/DualRecorder.exe
          if-no-files-found: error
          retention-days: 30
